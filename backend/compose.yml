services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: resume-backend:20260827
    container_name: resume-backend
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      ROLES_FILE: /data/roles.json
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
